server {
    listen 80;
    server_name alfredbaudisch.com www.alfredbaudisch.com;

    root /var/www/alfredbaudisch.com/_site;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               application/xml application/rss+xml
               font/truetype font/opentype application/vnd.ms-fontobject
               image/svg+xml;

    # Redirect WordPress media files to new location (must be before static assets)
    # Use prefix match with ^~ to take priority over regex matches
    location ^~ /wp-content/uploads/ {
        rewrite ^/wp-content/uploads/(.*)$ /media/wp-content/$1 permanent;
    }

    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|mp4|webm|ogg|wav|mp3|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files - shorter cache
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Redirect WordPress RSS to new location
    location ~ ^/feed/?$ {
        return 301 /feed.xml;
    }

    # Main location
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }







    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alfredbaudisch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alfredbaudisch.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

